# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = ~/.local/scripts/lock-screen
    before_sleep_cmd = ~/.local/scripts/lock-screen --wait
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# listener {
#     timeout = 30
#     on-timeout = ~/.local/scripts/monitor-brightness dim
#     on-resume = ~/.local/scripts/monitor-brightness restore
# }

listener {
    timeout = 300
    on-timeout = ~/.local/scripts/lock-screen
}

listener {
    timeout = 120
    on-timeout = hyprctl -j monitors | grep -Eq '"name":[[:space:]]*"TABLET"' || (sleep 1 && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })')
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && (hyprctl -j monitors | grep -Eq '"name":[[:space:]]*"DP-1"' && ~/.local/scripts/monitor-brightness restore || true)
}
