[package]
name = "ddc-slider"
version = "0.1.0"
edition = "2021"
description = "Waybar brightness applet with DDC/CI slider popup"

[[bin]]
name = "ddc-slider"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
