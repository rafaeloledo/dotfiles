[package]
name = "ddc-slider"
version = "0.2.0"
edition = "2021"
description = "Waybar DDC/CI brightness applet with native popup"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
