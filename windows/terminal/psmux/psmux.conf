# ── Prefix ──────────────────────────────────────────────────────────────────
unbind C-b
unbind n
unbind q

set-option -g prefix C-a

# ── Windows / Tabs ───────────────────────────────────────────────────────────
bind ^C new-window -c "$HOME"
# prefix+t: use direct new-window — run-shell wrapper didn't fire reliably in psmux
# (format expansion + PATH lookup of `psmux` from background shell was inconsistent)
bind -r t new-window -c "#{pane_current_path}"

bind ^P previous-window
bind ^N next-window
bind ^A last-window
bind ^D detach
bind c kill-pane -f
bind ^S choose-session
bind : command-prompt
bind x swap-pane -D
# Manual rename: prefill with current name, quote substitution, and turn off
# automatic-rename for this window so the new name isn't immediately clobbered
# by automatic-rename-format.
bind r command-prompt -p "rename-window:" -I "#W" "rename-window -- '%%' ; set-window-option automatic-rename off"
bind R source-file "$USERPROFILE/.config/psmux/psmux.conf"

# Move tabs
bind ^Left  swap-window -t -1 \; previous-window
bind ^Right swap-window -t +1 \; next-window

# ── Splits ───────────────────────────────────────────────────────────────────
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# ── Pane Navigation ──────────────────────────────────────────────────────────
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ── Resize ───────────────────────────────────────────────────────────────────
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20
bind -r -T prefix - resize-pane -D 7
bind -r -T prefix = resize-pane -U 7

# ── Copy mode — vi keys + Windows clipboard ──────────────────────────────────
# wl-copy is Wayland-only; psmux uses set-clipboard on for native Windows clipboard
set-window-option -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"

# ── Status Bar ───────────────────────────────────────────────────────────────
set-option -g status on
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

set-option -g status-style        bg=black,fg=white
set-option -g status-left-style   bg=black,fg=white
set-option -g status-right-style  bg=black,fg=white

set-window-option -g window-status-current-format " #[bold]#I:#W "
set-window-option -g window-status-current-style  bg=black,fg=white

set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-style  bg=black,fg=white

# ── Pane Borders ─────────────────────────────────────────────────────────────
set-option -g pane-border-style        fg=colour235
set-option -g pane-active-border-style fg=white

# ── Misc Options ─────────────────────────────────────────────────────────────
set -g base-index 1
set -g detach-on-destroy off
set -g renumber-windows on
set -g set-clipboard on        # native Windows clipboard via ConPTY
set -g mouse on
set-option -g history-limit 64096
# focus-events omitted — not supported in psmux

# ── Popups ───────────────────────────────────────────────────────────────────
# lazygit popup
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# Claude Code popup — uses $RANDOM since md5sum is not available natively on Windows
bind -r y run-shell '\
  SESSION="claude-$RANDOM"; \
  psmux has-session -t "$SESSION" 2>$null || \
  psmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  psmux display-popup -w80% -h80% -E "psmux attach-session -t $SESSION"'

# ── Misc Binds ───────────────────────────────────────────────────────────────
bind '"' choose-window
bind * list-clients
